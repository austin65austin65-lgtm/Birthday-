<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday Solen!</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: linear-gradient(135deg, #E63946, #1E1E2E);
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            overflow: hidden;
        }

        .container {
            width: 90%;
            max-width: 500px;
        }

        h1 {
            color: white;
            font-size: 38px;
            margin-bottom: 20px;
            animation: birthday 0s infinite alternate;
        }

        @keyframes birthday {
            from {
                transform: scale(1);
            }

            to {
                transform: scale(1.08);
            }
        }

        video {
            width: 100%;
            max-height: 60vh;
            border-radius: 15px;
            display: none;
            margin-bottom: 20px;
        }

        button {
            background: white;
            color: #ff5c8a;
            border: none;
            padding: 14px 28px;
            border-radius: 30px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        button:active {
            transform: scale(0.95);
        }

        #message {
            color: white;
            font-size: 20px;
            margin-top: 20px;
            display: none;
            animation: fadeIn 2s;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>🎂 Happy Birthday, Solen! 🎉</h1>

        <video id="birthdayVideo" controls>
            <source src="birthday.mp4" type="video/mp4">
            
        </video>

        <button id="playButton" onclick="playBirthday()">
            ▶ Play Birthday Video
        </button>

        <div id="message">
            💖 I hope you have an amazing birthday, Solen! 🎈
        </div>

    </div>

    <script>
        function playBirthday() {
            const video = document.getElementById("birthdayVideo");
            const button = document.getElementById("playButton");
            const message = document.getElementById("message");

            video.style.display = "block";
            message.style.display = "block";

            video.play();

            button.innerHTML = "🎬 Playing...";
            button.style.display = "none";
        }
    </script>

</body>
</html>
