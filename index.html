<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Happy Birthday Solen ❤️</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: #E63946;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            color: white;
        }

        .container {
            width: 90%;
            max-width: 600px;
        }

        h1 {
            font-size: 38px;
            margin-bottom: 25px;
        }

        video {
            width: 100%;
            max-height: 65vh;
            border-radius: 15px;
            display: none;
            background: black;
            margin-bottom: 20px;
        }

        button {
            border: none;
            padding: 15px 30px;
            border-radius: 30px;
            background: white;
            color: #E63946;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
        }

        button:active {
            transform: scale(0.95);
        }

        #message {
            display: none;
            font-size: 20px;
            margin-top: 15px;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>🎂 Happy Birthday, Solen! ❤️</h1>

        <button onclick="startVideo()">
            ▶️ Play Birthday Video
        </button>

        <video id="birthdayVideo" controls playsinline>
            <source src="./birthday.mp4" type="video/mp4">
            Your browser does not support video.
        </video>

        <div id="message">
            🎉 Hope you have an amazing birthday! ❤️
        </div>

    </div>

    <script>
        function startVideo() {
            const video = document.getElementById("birthdayVideo");
            const message = document.getElementById("message");

            video.style.display = "block";
            message.style.display = "block";

            video.currentTime = 0;

            video.play().catch(function(error) {
                console.log("Video could not autoplay:", error);
            });
        }
    </script>

</body>
</html>
